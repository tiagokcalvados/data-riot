<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Data Riot social image source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { background: radial-gradient(ellipse at 50% 40%, #075bb6 0, #073b89 42%, #052758 80%); color: white; font-family: Arial, Helvetica, sans-serif; }
    main { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 0; gap: 12px; }
    img { display: block; width: 540px; height: auto; filter: drop-shadow(0 12px 18px #00162c88); }
    .introduction { width: 600px; text-align: center; }
    .rule { display: none; }
    p { margin: 0; font-size: 26px; line-height: 1.2; font-style: italic; font-weight: 600; }
    .address { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="../data-riot-logo-transparent.png" width="1426" height="1103" alt="Data Riot Sound Lab, Amsterdam West">
    <div class="introduction">
      <div class="rule" aria-hidden="true"></div>
      <p>Experimental audiovisual explorations from a sound lab in an attic in Amsterdam West.</p>
      <p class="address">data-riot.vercel.app</p>
    </div>
  </main>
</body>
</html>
