<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Data Riot social image source</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { background: radial-gradient(ellipse at 18% 45%, #075bb6 0, #073b89 42%, #052758 75%); color: white; font-family: Arial, Helvetica, sans-serif; }
    main { width: 100%; height: 100%; display: grid; grid-template-columns: 610px 1fr; align-items: center; padding: 44px 56px 44px 24px; gap: 24px; }
    img { display: block; width: 610px; height: auto; filter: drop-shadow(0 12px 18px #00162c88); }
    .introduction { padding-top: 12px; }
    .rule { width: 86px; height: 5px; background: #ff2525; margin-bottom: 28px; }
    p { margin: 0; font-size: 38px; line-height: 1.22; font-style: italic; font-weight: 600; }
    .address { margin-top: 38px; font-size: 21px; line-height: 1.2; font-style: normal; font-weight: 400; color: #d2e8ff; }
  </style>
</head>
<body>
  <main>
    <img src="../data-riot-logo-transparent.png" width="1426" height="1103" alt="Data Riot Sound Lab, Amsterdam West">
    <div class="introduction">
      <div class="rule" aria-hidden="true"></div>
      <p>Experimental audiovisual explorations from a sound lab in an attic in Amsterdam West.</p>
      <p class="address">data-riot.vercel.app</p>
    </div>
  </main>
</body>
</html>
